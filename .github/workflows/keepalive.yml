name: Keep the demo awake

# Render's free plan sleeps after 15 minutes without traffic, which delays the next
# visitor by ~50 s and empties the demo index. Visit the site every 10 minutes.
# GitHub can run scheduled jobs a few minutes late; 10 leaves room under 15.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 https://lumen-referrals.onrender.com/healthz; then exit 0; fi
            echo "attempt $i failed, retrying"; sleep 10
          done
          echo "::warning::The demo didn't answer /healthz after 3 tries."
          exit 1
